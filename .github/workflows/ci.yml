name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-client
          command -v ssh-keygen

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Check module graph
        run: go list -mod=readonly ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build CLI
        run: go build -trimpath -o /tmp/goaudit ./cmd/goaudit

  docker:
    name: Sandbox image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install and register gVisor
        run: |
          arch="$(dpkg --print-architecture)"
          curl -fsSL https://gvisor.dev/archive.key |
            sudo gpg --dearmor --yes -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=${arch} signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" |
            sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes runsc
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q '"runsc"'

      - name: Build node sandbox image
        run: docker build --pull -t goaudit-node-sandbox:ci -f docker/Dockerfile.node-sandbox .

      - name: Build CLI
        run: go build -trimpath -o ./goaudit ./cmd/goaudit

      - name: Test privilege escalation fixtures
        run: ./scripts/test-privilege-escalation-e2e.sh
